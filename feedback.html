  'use strict';
  const catalog = JSON.parse(document.querySelector('#reader-catalog').textContent);
  const list = document.querySelector('#feedback-list');
  const reasons = {insightful:'有新认识', unclear:'解释不够清楚', repeated:'信息重复',
    not_relevant:'与我关联不大', unreliable:'可信度不足'};
  function exportEdition(edition, items) {
    // The same single-edition contract and filename as the reader's export (no upload).
    const payload = {schema:'daily-reader-feedback-v1', request_hash:edition.request,
      draft_hash:edition.draft, scope:'public_edition_browser', approval:false,
      rating_dimension:'reading_value', scale:{min:1, max:5}, items};
    const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'}));
    const link = document.createElement('a'); link.href = url;
    link.download = 'reading-feedback-' + edition.draft.slice(0,12) + '.json'; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  let count = 0, errors = false;
  for (const edition of catalog) {
    if (!edition.request || !edition.draft) continue;
    const key = 'daily-reader-feedback-v1:' + edition.request + ':' + edition.draft;
    let saved;
    try { saved = JSON.parse(localStorage.getItem(key) || 'null'); }
    catch (_) { errors = true; continue; }
    if (!saved) continue;
    const allowed = new Set(edition.items.map(x => x.id));
    if (saved.schema !== 'daily-reader-feedback-v1' || saved.request_hash !== edition.request ||
        saved.draft_hash !== edition.draft || saved.rating_dimension !== 'reading_value' ||
        !Array.isArray(saved.items) || !saved.items.every(row => row && allowed.has(row.item_id) &&
          typeof row.read === 'boolean' && (row.reason === null || (typeof row.reason === 'string' && Object.hasOwn(reasons, row.reason))) &&
          (row.rating === null || Number.isInteger(row.rating) && row.rating >= 1 && row.rating <= 5))) {
      errors = true; continue;
    }
    if (new Set(saved.items.map(row => row.item_id)).size !== saved.items.length) {
      errors = true; continue;
    }
    const rows = saved.items.filter(row => row.rating !== null || row.reason !== null);
    if (!rows.length) continue;
    const group = document.createElement('section'); group.setAttribute('aria-label', edition.date + ' 的反馈');
    const stamp = document.createElement('span'); stamp.className = 'feedback-date';
    stamp.textContent = edition.date;
    const action = document.createElement('button'); action.type = 'button'; action.className = 'secondary';
    action.textContent = '导出反馈'; action.addEventListener('click', () => exportEdition(edition, saved.items));
    group.append(stamp, action); list.append(group);
    for (const row of rows) {
      const story = edition.items.find(x => x.id === row.item_id);
      const card = document.createElement('article'); card.className = 'feedback-row';
      const title = document.createElement('h2'); title.textContent = story.title;
      const meta = document.createElement('p'); meta.className = 'feedback-meta';
      meta.textContent = (row.rating === null ? '未评分' : `阅读收获 ${row.rating} / 5`) +
        (row.reason ? ' · ' + reasons[row.reason] : '');
      const link = document.createElement('a');
      link.href = edition.href + '#' + story.anchor; link.textContent = '返回这篇 · 修改反馈';
      card.append(title, meta, link); group.append(card); count++;
    }
  }
  const summary = count ? `${count} 篇反馈，仅保存在此浏览器。` : '还没有反馈';
  document.querySelector('#feedback-status').textContent = errors
    ? (count ? summary + ' 部分记录无法读取。' : '部分浏览器记录无法读取，原记录未修改。') : summary;
})();
</script></body></html>
